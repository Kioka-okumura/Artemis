<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#163c34"><meta name="description" content="Artémis : des cours et des quiz gratuits pour explorer l'histoire de l'art à ton rythme."><title>Artémis — Apprendre à regarder l’art</title><style>
:root{--forest:#163c34;--forest2:#24594b;--cream:#faf7ef;--gold:#c69a54;--ink:#20382f;--muted:#66796e;--line:#e0e8df;--mint:#eaf2e9}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.6 system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}.wrap{max-width:1160px;margin:auto;padding:0 22px}.top{background:var(--forest);color:#fff;position:sticky;top:0;z-index:10;box-shadow:0 2px 15px #0c302424}.nav{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:74px;flex-wrap:wrap}.brand{font:30px Georgia,serif;letter-spacing:.02em;white-space:nowrap}.brand span{color:#e4bd7a}.links{display:flex;gap:5px;overflow-x:auto}.links button{color:#fff;border:1px solid transparent;background:transparent;padding:9px 13px;border-radius:12px;white-space:nowrap}.links button.active,.links button:hover{border-color:#90b4a5;background:#ffffff19}.hero{background:radial-gradient(circle at 80% 15%,#3b705c 0,transparent 34%),linear-gradient(125deg,#163c34,#245447);color:white;padding:68px 0 92px}.eyebrow{text-transform:uppercase;letter-spacing:.16em;font-weight:800;color:#e9ca92;font-size:12px}.hero h1{font:normal clamp(39px,6vw,70px)/1.09 Georgia,serif;max-width:770px;margin:14px 0 18px}.hero p{font-size:18px;max-width:670px;color:#e4ede7}.main{padding:28px 0 80px;min-height:55vh}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:-67px;position:relative}.stat,.card,.panel{background:#fff;border:1px solid var(--line);border-radius:19px;box-shadow:0 10px 30px #1a46300b}.stat{padding:19px}.stat strong{display:block;color:var(--forest);font:32px Georgia,serif}.stat small,.muted{color:var(--muted)}h2{font:normal 33px Georgia,serif;margin:32px 0 8px}h3{font-size:20px;margin:8px 0}p{margin:8px 0 16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin:22px 0}.card{padding:23px;overflow:hidden}.card p{color:var(--muted)}.tag{display:inline-block;background:var(--mint);color:var(--forest);font-size:12px;font-weight:750;border-radius:40px;padding:5px 12px}.action{border:1px solid var(--forest);background:var(--forest);color:#fff;border-radius:11px;padding:11px 16px;font-weight:700}.action:hover{background:var(--forest2)}.action.secondary{background:#fff;color:var(--forest)}.action.secondary:hover{background:var(--mint)}.action:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:18px}.panel{padding:28px;margin:24px 0}.art{height:190px;background:linear-gradient(145deg,#dce9dd,#e8dfc7);margin:-23px -23px 18px;display:flex;align-items:center;justify-content:center;overflow:hidden}.art img{width:100%;height:100%;object-fit:cover}.art .fallback{font-size:50px}.progress{height:11px;background:#e3ece5;border-radius:30px;overflow:hidden;margin:12px 0}.progress>div{height:100%;background:var(--gold)}.question{font-size:24px;font-weight:750}.answers{display:grid;gap:11px;margin:20px 0}.answer{border:1px solid #cbd9d0;background:white;border-radius:12px;padding:14px 16px;text-align:left}.answer:hover:not(:disabled){background:#edf5ef}.answer.correct{background:#e2f5e7;border-color:#42875a}.answer.wrong{background:#fbe8e4;border-color:#b36a5e}.feedback{font-weight:800}.empty{border:1px dashed #adc2b4;padding:25px;border-radius:16px}.lesson{border-left:3px solid var(--gold);padding-left:18px;margin:25px 0}.search{width:100%;max-width:480px;border:1px solid #b7cabc;border-radius:11px;padding:12px;background:#fff}.filter{padding:11px;border:1px solid #b7cabc;border-radius:11px;background:#fff;max-width:100%}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}.course-icon{font-size:40px}.notice{background:#f4f0e4;border-left:4px solid var(--gold);padding:14px 18px;border-radius:8px}.footer{border-top:1px solid var(--line);padding:27px 0;color:var(--muted);font-size:13px}.footer a{color:var(--forest)}@media(max-width:700px){.nav{padding:12px 0}.links{width:100%}.links button{padding:8px 11px}.hero{padding:44px 0 85px}.grid{grid-template-columns:1fr}.stats{gap:8px}.stat{padding:13px}.stat strong{font-size:25px}.wrap{padding:0 16px}.panel{padding:19px}.art{margin:-23px -23px 18px}}
</style></head><body><header class="top"><div class="wrap nav"><div class="brand">✦ Arté<span>mis</span></div><nav class="links" aria-label="Navigation principale"><button data-tab="home">Accueil</button><button data-tab="courses">Cours</button><button data-tab="works">Œuvres</button><button data-tab="quiz">Exercices</button><button data-tab="museum">Mon musée</button></nav></div></header><div id="app"></div><footer class="footer"><div class="wrap">Artémis · Apprendre à regarder l’art · Projet éducatif gratuit · Version 0.2 · <a href="https://commons.wikimedia.org/" target="_blank" rel="noopener noreferrer">Images : Wikimedia Commons</a></div></footer><script>
const DATA={"courses":[{"id":"antique","title":"L’art de l’Antiquité","era":"Antiquité","emoji":"🏛️","minutes":12,"description":"Égypte, Grèce et Rome : trois regards sur l’image.","sections":[{"heading":"L’art égyptien","body":"Les images égyptiennes suivent souvent des conventions : les figures combinent différents points de vue pour rendre chaque partie du corps lisible. L’art accompagne les rites, le pouvoir et les croyances sur l’au-delà."},{"heading":"L’idéal grec","body":"Les sculpteurs grecs étudient les proportions et les mouvements du corps. Le Discobole illustre l’intérêt pour la tension d’un geste saisi dans le temps."},{"heading":"Rome et la mémoire","body":"Les Romains utilisent portraits, monuments et reliefs pour célébrer les personnes, les événements et l’autorité politique."}]},{"id":"renaissance","title":"La Renaissance","era":"XVe–XVIe siècles","emoji":"🎨","minutes":10,"description":"Perspective, humanisme et observation du monde.","sections":[{"heading":"Regarder autrement","body":"À la Renaissance, de nombreux artistes européens étudient l’Antiquité et expérimentent de nouvelles manières de représenter l’espace et le corps humain."},{"heading":"La perspective","body":"La perspective linéaire organise l’espace autour de lignes convergeant vers un point de fuite : elle donne une impression de profondeur sur une surface plane."},{"heading":"Lumière et portraits","body":"Léonard de Vinci emploie des transitions délicates entre lumière et ombre, souvent associées au sfumato, pour modeler les visages."}]},{"id":"impressionnisme","title":"L’impressionnisme","era":"XIXe siècle","emoji":"🌤️","minutes":9,"description":"Lumière, couleurs et scènes de la vie moderne.","sections":[{"heading":"Un autre regard","body":"Dans les années 1870, des artistes exposent en dehors du Salon officiel et cherchent à saisir les sensations visuelles d’un instant."},{"heading":"La touche visible","body":"Des touches de couleur parfois distinctes suggèrent les reflets, l’atmosphère et les variations lumineuses."},{"heading":"Une œuvre fondatrice","body":"Impression, soleil levant de Monet, peint en 1872, contribue à donner son nom au mouvement."}]},{"id":"nouveau","title":"L’Art nouveau","era":"Vers 1890–1914","emoji":"🌿","minutes":11,"description":"Quand les arts décoratifs rencontrent la nature.","sections":[{"heading":"Un art du quotidien","body":"L’Art nouveau touche l’architecture, les affiches, les meubles, les bijoux et la verrerie : il cherche à rapprocher beauté et vie quotidienne."},{"heading":"Des lignes organiques","body":"Courbes souples, motifs floraux et silhouettes élancées rappellent les formes du vivant."},{"heading":"L’affiche artistique","body":"Alphonse Mucha donne aux affiches publicitaires une composition très décorative, avec des chevelures fluides et des ornements végétaux."}]}],"works":[{"id":"joconde","name":"La Joconde","artist":"Léonard de Vinci","date":"vers 1503–1519","era":"Renaissance","note":"Portrait célèbre pour ses transitions de lumière subtiles et son paysage lointain.","image":"https://commons.wikimedia.org/wiki/Special:FilePath/Mona_Lisa,_by_Leonardo_da_Vinci,_from_C2RMF_retouched.jpg"},{"id":"venus","name":"La Naissance de Vénus","artist":"Sandro Botticelli","date":"vers 1485","era":"Renaissance","note":"Une scène mythologique inspirée de l’Antiquité, caractérisée par ses lignes élégantes.","image":"https://commons.wikimedia.org/wiki/Special:FilePath/Sandro_Botticelli_-_La_nascita_di_Venere_-_Google_Art_Project_-_edited.jpg"},{"id":"soleil","name":"Impression, soleil levant","artist":"Claude Monet","date":"1872","era":"Impressionnisme","note":"Une vue du port du Havre qui a donné son nom à l’impressionnisme.","image":"https://commons.wikimedia.org/wiki/Special:FilePath/Claude_Monet,_Impression,_soleil_levant.jpg"},{"id":"bal","name":"Bal du moulin de la Galette","artist":"Auguste Renoir","date":"1876","era":"Impressionnisme","note":"Une scène festive parisienne animée par les jeux de lumière.","image":"https://commons.wikimedia.org/wiki/Special:FilePath/Auguste_Renoir_-_Dance_at_Le_Moulin_de_la_Galette.jpg"},{"id":"kiss","name":"Le Baiser","artist":"Gustav Klimt","date":"1907–1908","era":"Sécession viennoise","note":"Une composition aux motifs géométriques et aux surfaces dorées.","image":"https://commons.wikimedia.org/wiki/Special:FilePath/Gustav_Klimt_016.jpg"},{"id":"job","name":"JOB","artist":"Alphonse Mucha","date":"1896","era":"Art nouveau","note":"Affiche publicitaire célèbre pour sa ligne sinueuse et ses motifs décoratifs.","image":"https://commons.wikimedia.org/wiki/Special:FilePath/Alfons_Mucha_-_Job.jpg"},{"id":"discobole","name":"Le Discobole","artist":"Myron (original perdu)","date":"Ve siècle av. J.-C.","era":"Antiquité","note":"Statue grecque connue grâce à des copies romaines, montrant un athlète au lancer.","image":"https://commons.wikimedia.org/wiki/Special:FilePath/Discobolus_in_National_Roman_Museum_Palazzo_Massimo_alle_Terme.jpg"},{"id":"nefertiti","name":"Buste de Néfertiti","artist":"Atelier de Thoutmôsis (attribution)","date":"vers 1340 av. J.-C.","era":"Égypte antique","note":"Buste polychrome de la période amarnienne, conservé à Berlin.","image":"https://commons.wikimedia.org/wiki/Special:FilePath/Nofretete_Neues_Museum.jpg"}],"questions":[{"q":"Quel mouvement étudie les effets changeants de la lumière ?","a":["Le cubisme","L’impressionnisme","Le gothique"],"correct":1,"why":"Les impressionnistes travaillent les variations de lumière et de couleur.","topic":"impressionnisme"},{"q":"La perspective linéaire se développe particulièrement à la Renaissance.","a":["Vrai","Faux"],"correct":0,"why":"Elle devient un outil important pour représenter la profondeur.","topic":"renaissance"},{"q":"Qui a peint Impression, soleil levant ?","a":["Claude Monet","Sandro Botticelli","Gustav Klimt"],"correct":0,"why":"Claude Monet a peint cette œuvre en 1872.","topic":"impressionnisme"},{"q":"Quel motif est fréquent dans l’Art nouveau ?","a":["Les courbes végétales","Les pixels","Les angles uniquement droits"],"correct":0,"why":"Les lignes inspirées du vivant sont très présentes.","topic":"nouveau"},{"q":"Le Discobole représente un athlète.","a":["Vrai","Faux"],"correct":0,"why":"Il représente un lanceur de disque en mouvement.","topic":"antique"},{"q":"Qui a peint La Joconde ?","a":["Auguste Renoir","Léonard de Vinci","Alphonse Mucha"],"correct":1,"why":"La Joconde est une œuvre de Léonard de Vinci.","topic":"renaissance"},{"q":"Qui est connu pour ses affiches Art nouveau ?","a":["Alphonse Mucha","Myron","Claude Monet"],"correct":0,"why":"Mucha a réalisé de nombreuses affiches décoratives.","topic":"nouveau"},{"q":"L’Art nouveau concerne uniquement la peinture.","a":["Vrai","Faux"],"correct":1,"why":"Il touche aussi le mobilier, la verrerie, l’architecture et l’affiche.","topic":"nouveau"},{"q":"Quelle œuvre représente une fête parisienne ?","a":["Le Baiser","Bal du moulin de la Galette","La Naissance de Vénus"],"correct":1,"why":"Renoir a représenté une scène festive au moulin de la Galette.","topic":"impressionnisme"},{"q":"Le Baiser de Klimt s’inscrit dans la Sécession viennoise.","a":["Vrai","Faux"],"correct":0,"why":"Klimt est une figure importante de la Sécession viennoise.","topic":"nouveau"},{"q":"À quelle époque associe-t-on Botticelli ?","a":["Renaissance","Art nouveau","Impressionnisme"],"correct":0,"why":"Botticelli travaille à Florence durant la Renaissance.","topic":"renaissance"},{"q":"Néfertiti appartient à quelle civilisation ?","a":["Rome antique","Égypte antique","Grèce antique"],"correct":1,"why":"Néfertiti est une reine de l’Égypte antique.","topic":"antique"}]};const {courses,works,questions}=DATA;const KEY='artemis-demo-v1';let state;try{state=JSON.parse(localStorage.getItem(KEY))||{}}catch{state={}}state.done=Array.isArray(state.done)?state.done:[];state.saved=Array.isArray(state.saved)?state.saved:[];state.answered=state.answered&&typeof state.answered==='object'?state.answered:{};let tab='home',courseOpen=null,workOpen=null,quizIndex=0,filter='all',search='',quizTopic='all';const app=document.getElementById('app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function persist(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}}function score(){return Object.keys(state.answered).filter(i=>questions[i]&&state.answered[i]===questions[i].correct).length}function xp(){return state.done.length*50+score()*10}function hero(title,subtitle){return `<section class="hero"><div class="wrap"><div class="eyebrow">✦ ARTÉMIS · HISTOIRE DE L’ART</div><h1>${title}</h1><p>${subtitle}</p></div></section>`}function stats(){return `<div class="stats"><div class="stat"><strong>${xp()}</strong><small>XP gagnés</small></div><div class="stat"><strong>${state.done.length}/${courses.length}</strong><small>Cours terminés</small></div><div class="stat"><strong>${state.saved.length}</strong><small>Œuvres favorites</small></div></div>`}function courseCards(items=courses){return `<div class="grid">${items.map(c=>`<article class="card"><div class="course-icon">${c.emoji}</div><span class="tag">${esc(c.era)} · ${c.minutes} min</span><h3>${esc(c.title)}</h3><p>${esc(c.description)}</p><div class="actions"><button class="action" data-course="${c.id}">${state.done.includes(c.id)?'Relire le cours':'Découvrir le cours'}</button>${state.done.includes(c.id)?'<span class="tag">✓ Terminé</span>':''}</div></article>`).join('')}</div>`}function workCards(items=works){return `<div class="grid">${items.map(w=>`<article class="card"><div class="art"><img src="${esc(w.image)}" loading="lazy" alt="Reproduction : ${esc(w.name)}" onerror="this.style.display='none';this.nextElementSibling.hidden=false"><span class="fallback" hidden>🖼️</span></div><span class="tag">${esc(w.era)}</span><h3>${esc(w.name)}</h3><div class="muted">${esc(w.artist)} · ${esc(w.date)}</div><p>${esc(w.note)}</p><div class="actions"><button class="action secondary" data-work="${w.id}">Lire la fiche</button><button class="action" data-save="${w.id}">${state.saved.includes(w.id)?'♥ Retirer du musée':'♡ Ajouter au musée'}</button></div></article>`).join('')}</div>`}function render(){document.querySelectorAll('[data-tab]').forEach(b=>{b.classList.toggle('active',b.dataset.tab===tab);b.setAttribute('aria-current',b.dataset.tab===tab?'page':'false')});let out='';if(tab==='home'){out=hero('L’art se découvre à ton rythme.','Explore les époques, rencontre les artistes et entraîne ton regard. Ici, aucun parcours n’est imposé.')+`<main class="wrap main">${stats()}<h2>À toi de choisir</h2><p class="muted">Tous les cours sont disponibles dès le départ.</p>${courseCards()}<section class="panel"><h2>Le défi des œuvres</h2><p>12 questions pour réviser, apprendre et gagner des points d’expérience.</p><button class="action" data-go="quiz">Faire un quiz →</button></section></main>`}else if(tab==='courses'){const c=courses.find(x=>x.id===courseOpen);out=hero('Les cours','Quatre premières escales dans l’histoire de l’art. Choisis librement ton sujet.')+`<main class="wrap main">${c?`<button class="action secondary" data-back="courses">← Tous les cours</button><article class="panel"><div class="course-icon">${c.emoji}</div><span class="tag">${esc(c.era)} · ${c.minutes} min</span><h2>${esc(c.title)}</h2><p>${esc(c.description)}</p>${c.sections.map((s,i)=>`<section class="lesson"><span class="muted">Partie ${i+1} / ${c.sections.length}</span><h3>${esc(s.heading)}</h3><p>${esc(s.body)}</p></section>`).join('')}<div class="notice">À retenir : prends le temps d’observer les formes, les matériaux et le contexte de création.</div><div class="actions"><button class="action" data-done="${c.id}">${state.done.includes(c.id)?'✓ Cours déjà terminé':'Terminer ce cours · +50 XP'}</button><button class="action secondary" data-go="quiz" data-topic="${c.id}">Réviser ce thème →</button></div></article>`:courseCards()}</main>`}else if(tab==='works'){const w=works.find(x=>x.id===workOpen);let selected=works.filter(w=>(filter==='all'||w.era===filter)&&(`${w.name} ${w.artist} ${w.era}`.toLowerCase().includes(search.toLowerCase())));out=hero('Les œuvres','Observe, compare et construis ton propre musée imaginaire.')+`<main class="wrap main">${w?`<button class="action secondary" data-back="works">← Toutes les œuvres</button><article class="panel"><div class="art" style="height:clamp(240px,45vw,470px);margin:0 0 20px"><img src="${esc(w.image)}" alt="${esc(w.name)}" onerror="this.style.display='none';this.nextElementSibling.hidden=false"><span class="fallback" hidden>🖼️</span></div><span class="tag">${esc(w.era)}</span><h2>${esc(w.name)}</h2><p><strong>Artiste :</strong> ${esc(w.artist)}</p><p><strong>Datation :</strong> ${esc(w.date)}</p><p>${esc(w.note)}</p><div class="notice">Question d’observation : quels détails attirent d’abord ton regard ? Quelles couleurs, lignes ou matières dominent ?</div><div class="actions"><button class="action" data-save="${w.id}">${state.saved.includes(w.id)?'♥ Retirer du musée':'♡ Ajouter au musée'}</button><a class="action secondary" href="${esc(w.image)}" target="_blank" rel="noopener noreferrer">Voir la reproduction ↗</a></div></article>`:`<div class="toolbar"><input id="work-search" class="search" type="search" placeholder="Rechercher une œuvre ou un artiste" aria-label="Rechercher une œuvre" value="${esc(search)}"><select id="work-filter" class="filter" aria-label="Filtrer par mouvement"><option value="all">Toutes les périodes</option>${[...new Set(works.map(w=>w.era))].map(e=>`<option value="${esc(e)}" ${filter===e?'selected':''}>${esc(e)}</option>`).join('')}</select></div><div id="work-results">${selected.length?workCards(selected):'<div class="empty">Aucune œuvre ne correspond à cette recherche.</div>'}</div>`}</main>`}else if(tab==='museum'){out=hero('Mon musée','Tes découvertes préférées réunies au même endroit.')+`<main class="wrap main">${stats()}<h2>Ma collection</h2>${state.saved.length?workCards(works.filter(w=>state.saved.includes(w.id))):'<div class="empty">Ton musée est encore vide. <button class="action" data-go="works">Découvrir les œuvres</button></div>'}<p class="muted">Les favoris et les XP sont enregistrés uniquement dans ce navigateur. Ils ne se synchronisent pas entre appareils.</p></main>`}else{let indices=questions.map((q,i)=>i).filter(i=>quizTopic==='all'||questions[i].topic===quizTopic);if(!indices.includes(quizIndex))quizIndex=indices[0]??0;let q=questions[quizIndex],ans=state.answered[quizIndex],chosen=ans===undefined?null:ans,pos=indices.indexOf(quizIndex);out=hero('Les exercices','Un entraînement sans pression : chaque réponse t’aide à mieux comprendre l’art.')+`<main class="wrap main"><section class="panel"><label for="quiz-filter"><strong>Choisir un thème : </strong></label><select class="filter" id="quiz-filter"><option value="all" ${quizTopic==='all'?'selected':''}>Tous les thèmes</option>${courses.map(c=>`<option value="${c.id}" ${quizTopic===c.id?'selected':''}>${esc(c.title)}</option>`).join('')}</select><p class="muted">Question ${pos+1} sur ${indices.length}</p><div class="progress"><div style="width:${(pos+1)/indices.length*100}%"></div></div><h2 class="question">${esc(q.q)}</h2><div class="answers">${q.a.map((a,i)=>`<button class="answer ${chosen!==null?(i===q.correct?'correct':i===chosen?'wrong':''):''}" data-answer="${i}" ${chosen!==null?'disabled':''}>${esc(a)}</button>`).join('')}</div>${chosen!==null?`<p class="feedback">${chosen===q.correct?'✓ Bonne réponse !':'Pas tout à fait !'}</p><p>${esc(q.why)}</p>`:''}<div class="actions"><button class="action secondary" data-prev ${pos===0?'disabled':''}>← Précédente</button><button class="action" data-next ${pos===indices.length-1?'disabled':''}>Suivante →</button><button class="action secondary" data-restart>Réinitialiser mes réponses</button></div><p class="muted">${score()} bonnes réponses enregistrées sur ${questions.length} · ${xp()} XP au total</p></section></main>`}app.innerHTML=out}document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let scroll=true;if(b.dataset.tab){tab=b.dataset.tab;courseOpen=null;workOpen=null}else if(b.dataset.go){tab=b.dataset.go;if(b.dataset.topic)quizTopic=b.dataset.topic}else if(b.dataset.course){tab='courses';courseOpen=b.dataset.course}else if(b.dataset.work){tab='works';workOpen=b.dataset.work}else if(b.dataset.back){tab=b.dataset.back;courseOpen=null;workOpen=null}else if(b.dataset.done){if(!state.done.includes(b.dataset.done))state.done.push(b.dataset.done);persist()}else if(b.dataset.save){state.saved=state.saved.includes(b.dataset.save)?state.saved.filter(x=>x!==b.dataset.save):[...state.saved,b.dataset.save];persist();scroll=false}else if(b.dataset.answer!==undefined){if(state.answered[quizIndex]===undefined){state.answered[quizIndex]=Number(b.dataset.answer);persist()}scroll=false}else if(b.hasAttribute('data-next')||b.hasAttribute('data-prev')){let indices=questions.map((q,i)=>i).filter(i=>quizTopic==='all'||q.topic===quizTopic),p=indices.indexOf(quizIndex)+(b.hasAttribute('data-next')?1:-1);quizIndex=indices[Math.max(0,Math.min(indices.length-1,p))]}else if(b.hasAttribute('data-restart')){if(confirm('Effacer les réponses aux quiz ? Les cours terminés et les favoris seront conservés.')){state.answered={};persist();quizIndex=questions.findIndex(q=>quizTopic==='all'||q.topic===quizTopic)}}render();if(scroll)window.scrollTo({top:0,behavior:'instant'})});document.addEventListener('change',e=>{if(e.target.id==='work-filter'){filter=e.target.value;render()}if(e.target.id==='quiz-filter'){quizTopic=e.target.value;quizIndex=questions.findIndex(q=>quizTopic==='all'||q.topic===quizTopic);render()}});document.addEventListener('input',e=>{if(e.target.id==='work-search'){search=e.target.value;let selected=works.filter(w=>(filter==='all'||w.era===filter)&&(`${w.name} ${w.artist} ${w.era}`.toLowerCase().includes(search.toLowerCase())));document.getElementById('work-results').innerHTML=selected.length?workCards(selected):'<div class="empty">Aucune œuvre ne correspond à cette recherche.</div>'}});render();
</script></body></html>
