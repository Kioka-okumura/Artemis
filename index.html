<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#183f36"><meta name="description" content="Artémis : apprends l'histoire de l'art à ton rythme, avec des cours, des œuvres et des quiz gratuits."><title>Artémis — Apprendre à regarder l'art</title><style>
:root{--green:#183f36;--mint:#e6eee7;--cream:#faf7ef;--gold:#b68a48;--ink:#20352e;--muted:#65766e;--white:#fff;--line:#e2e6df}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #b68a48;outline-offset:3px}.shell{max-width:1160px;margin:auto;padding:0 24px}.top{background:var(--green);color:white}.nav{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:76px;flex-wrap:wrap}.logo{font:700 29px Georgia,serif;letter-spacing:.03em}.logo span{color:#d4b47d}.links{display:flex;gap:8px;flex-wrap:wrap}.links button{background:transparent;border:1px solid transparent;color:white;border-radius:12px;padding:9px 13px}.links button.active,.links button:hover{border-color:#b9cbbf;background:#ffffff18}.hero{background:var(--green);color:white;padding:58px 0 70px}.eyebrow{color:#e2c99b;letter-spacing:.17em;text-transform:uppercase;font-size:12px;font-weight:800}.hero h1{font:normal clamp(38px,6vw,68px)/1.1 Georgia,serif;max-width:800px;margin:14px 0}.hero p{max-width:600px;color:#e3e9e2;font-size:18px}.pill{display:inline-block;border:1px solid #e0cda8;border-radius:50px;padding:7px 14px;color:#f4e4c8;font-size:13px}.cta{background:#e7c891;color:#213b31;border:0;border-radius:13px;padding:13px 21px;font-weight:750;margin-top:16px}.main{padding:36px 0 80px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:-65px;position:relative}.stat,.card,.panel{background:white;border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 24px #1b3b2810}.stat{padding:20px}.stat strong{display:block;font:30px Georgia,serif;color:var(--green)}.stat small{color:var(--muted)}h2{font:normal 32px Georgia,serif;margin:35px 0 8px}h3{margin:8px 0;font-size:20px}p{margin:8px 0 15px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:22px}.card{padding:23px}.tag{display:inline-block;background:var(--mint);color:var(--green);font-size:12px;font-weight:750;border-radius:30px;padding:5px 11px}.card p{color:var(--muted)}.action{border:1px solid var(--green);background:var(--green);color:white;border-radius:10px;padding:10px 16px;font-weight:650}.action.secondary{background:white;color:var(--green)}.action:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.work{border-left:4px solid var(--gold)}.panel{padding:26px;margin-top:22px}.question{font-size:22px;font-weight:700}.answers{display:grid;gap:10px;margin:18px 0}.answer{text-align:left;border:1px solid #ccd7cf;background:#fff;padding:13px 16px;border-radius:12px}.answer:hover:not(:disabled){background:#edf3ed}.answer.correct{border-color:#397d53;background:#e3f4e6}.answer.wrong{border-color:#a45a4d;background:#fae6e2}.feedback{font-weight:700}.progress{height:10px;background:#e1e9e2;border-radius:20px;overflow:hidden}.progress>div{height:100%;background:var(--gold);transition:width .2s}.empty{border:1px dashed #b9c9bd;padding:22px;border-radius:15px}.footer{border-top:1px solid var(--line);padding:26px 0;color:var(--muted);font-size:13px}a{color:inherit}#app{min-height:350px}@media(max-width:650px){.nav{padding:16px 0}.links{width:100%;overflow:auto;flex-wrap:nowrap}.links button{white-space:nowrap}.hero{padding:38px 0 76px}.grid{grid-template-columns:1fr}.stats{gap:8px}.stat{padding:14px}.stat strong{font-size:24px}.shell{padding:0 16px}.panel{padding:18px}}
</style></head><body><header class="top"><div class="shell nav"><div class="logo">✦ Arté<span>mis</span></div><nav class="links" aria-label="Navigation principale"><button data-tab="home">Accueil</button><button data-tab="courses">Cours</button><button data-tab="works">Œuvres</button><button data-tab="quiz">Exercices</button><button data-tab="museum">Mon musée</button></nav></div></header><div id="app"></div><footer class="footer"><div class="shell">Artémis • Apprendre à regarder l'art • Projet éducatif gratuit • Première version de démonstration</div></footer><script>
const courses=[{id:'antique',title:'L’art de l’Antiquité',era:'Antiquité',minutes:12,description:'Symboles, proportions et héritages de l’Égypte, de la Grèce et de Rome.',sections:['En Égypte antique, l’art accompagne la religion et la vie après la mort. Les figures suivent souvent des conventions de représentation précises.','En Grèce, les artistes étudient les proportions du corps humain et développent des idéaux d’équilibre et de mouvement.','À Rome, portraits, architectures et images publiques participent à la mémoire et à la représentation du pouvoir.']},{id:'renaissance',title:'La Renaissance',era:'XVe–XVIe siècles',minutes:10,description:'Perspective, humanisme et nouvelles manières de représenter le monde.',sections:['La Renaissance européenne renouvelle l’étude de l’Antiquité et place l’observation au cœur de nombreux projets artistiques.','La perspective linéaire permet de représenter un espace cohérent à partir d’un point de vue.','Les artistes expérimentent l’anatomie, la lumière et la composition pour donner davantage de présence aux figures.']},{id:'impressionnisme',title:'L’impressionnisme',era:'XIXe siècle',minutes:9,description:'Couleurs, lumière et instants de la vie moderne.',sections:['À partir des années 1870, plusieurs peintres exposent en marge des circuits officiels et explorent une peinture attentive à la perception.','Touches visibles, variations de lumière et scènes quotidiennes deviennent des moyens de renouveler la peinture.','Le nom du mouvement est associé au tableau Impression, soleil levant de Claude Monet.']},{id:'nouveau',title:'L’Art nouveau',era:'Vers 1890–1914',minutes:11,description:'Lignes végétales, arts décoratifs et beauté du quotidien.',sections:['L’Art nouveau se développe dans plusieurs pays autour de 1900 et cherche à rapprocher les arts et la vie quotidienne.','Ses formes privilégient souvent les courbes, les motifs floraux et les lignes inspirées du vivant.','Architecture, affiches, verrerie, mobilier et bijoux deviennent des terrains d’expérimentation.']}];
const works=[{id:'joconde',name:'La Joconde',artist:'Léonard de Vinci',date:'vers 1503–1519',era:'Renaissance',note:'Portrait célèbre pour son modelé subtil et son paysage énigmatique.'},{id:'venus',name:'La Naissance de Vénus',artist:'Sandro Botticelli',date:'vers 1485',era:'Renaissance',note:'Scène mythologique emblématique de la Florence de la Renaissance.'},{id:'soleil',name:'Impression, soleil levant',artist:'Claude Monet',date:'1872',era:'Impressionnisme',note:'Vue du port du Havre qui a donné son nom à l’impressionnisme.'},{id:'bal',name:'Bal du moulin de la Galette',artist:'Auguste Renoir',date:'1876',era:'Impressionnisme',note:'Scène de sociabilité parisienne animée par des touches de lumière.'},{id:'kiss',name:'Le Baiser',artist:'Gustav Klimt',date:'1907–1908',era:'Sécession viennoise',note:'Une œuvre aux motifs décoratifs et aux feuilles métalliques.'},{id:'job',name:'JOB',artist:'Alphonse Mucha',date:'1896',era:'Art nouveau',note:'Affiche publicitaire aux lignes fluides et aux ornements végétaux.'},{id:'discobole',name:'Le Discobole',artist:'Myron (original perdu)',date:'Ve siècle av. J.-C.',era:'Antiquité',note:'Statue grecque connue par des copies romaines, montrant un athlète en mouvement.'},{id:'nefertiti',name:'Buste de Néfertiti',artist:'Atelier de Thoutmôsis (attribution)',date:'vers 1340 av. J.-C.',era:'Égypte antique',note:'Portrait sculpté polychrome associé à la période amarnienne.'}];
const questions=[{q:'Quel mouvement s’intéresse particulièrement aux effets changeants de la lumière ?',a:['Le cubisme','L’impressionnisme','Le gothique'],correct:1,why:'Les impressionnistes explorent les variations de lumière et de couleur.'},{q:'La perspective linéaire se développe particulièrement à la Renaissance.',a:['Vrai','Faux'],correct:0,why:'Elle joue un rôle important dans la représentation de l’espace à la Renaissance.'},{q:'Qui a peint Impression, soleil levant ?',a:['Claude Monet','Sandro Botticelli','Gustav Klimt'],correct:0,why:'Claude Monet réalise cette œuvre en 1872.'},{q:'Quel motif est fréquent dans l’Art nouveau ?',a:['Les courbes végétales','Les grilles de pixels','Les angles uniquement droits'],correct:0,why:'Les formes inspirées du monde végétal sont très présentes.'},{q:'Le Discobole représente un athlète.',a:['Vrai','Faux'],correct:0,why:'Il montre un lanceur de disque en mouvement.'},{q:'La Joconde est associée à quel artiste ?',a:['Auguste Renoir','Léonard de Vinci','Alphonse Mucha'],correct:1,why:'La Joconde est une œuvre de Léonard de Vinci.'},{q:'Quel artiste est connu pour ses affiches Art nouveau ?',a:['Alphonse Mucha','Myron','Claude Monet'],correct:0,why:'Mucha a créé de nombreuses affiches emblématiques.'},{q:'L’Art nouveau concerne uniquement la peinture.',a:['Vrai','Faux'],correct:1,why:'Il touche aussi l’architecture, le mobilier, la verrerie et bien d’autres domaines.'},{q:'Quel tableau représente une scène de danse et de rencontre à Paris ?',a:['Le Baiser','Bal du moulin de la Galette','La Naissance de Vénus'],correct:1,why:'Renoir représente une scène festive au moulin de la Galette.'},{q:'Le Baiser de Klimt appartient au contexte de la Sécession viennoise.',a:['Vrai','Faux'],correct:0,why:'Klimt est une figure majeure de la Sécession viennoise.'},{q:'À quelle époque associe-t-on Botticelli ?',a:['Renaissance','Art nouveau','Impressionnisme'],correct:0,why:'Botticelli travaille à Florence durant la Renaissance.'},{q:'Le buste de Néfertiti est associé à quelle civilisation ?',a:['Rome antique','Égypte antique','Grèce antique'],correct:1,why:'Néfertiti est une reine de l’Égypte antique.'}];
const key='artemis-demo-v1';let state;try{state=JSON.parse(localStorage.getItem(key))||{done:[],saved:[],answered:{}}}catch{state={done:[],saved:[],answered:{}}}state.done||=[];state.saved||=[];state.answered||={};let tab='home',courseOpen=null,workOpen=null,quizIndex=0,quizChoice=null;const app=document.getElementById('app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function persist(){localStorage.setItem(key,JSON.stringify(state))}function xp(){return state.done.length*50+Object.keys(state.answered).filter(i=>state.answered[i]===questions[i].correct).length*10}function stats(){return `<div class="stats"><div class="stat"><strong>${xp()}</strong><small>Points d’expérience</small></div><div class="stat"><strong>${state.done.length}/4</strong><small>Cours terminés</small></div><div class="stat"><strong>${state.saved.length}</strong><small>Œuvres favorites</small></div></div>`}function hero(title,subtitle,eyebrow='ARTÉMIS · HISTOIRE DE L’ART'){return `<section class="hero"><div class="shell"><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${subtitle}</p></div></section>`}function courseCards(items=courses){return `<div class="grid">${items.map(c=>`<article class="card"><span class="tag">${esc(c.era)} · ${c.minutes} min</span><h3>${esc(c.title)}</h3><p>${esc(c.description)}</p><div class="actions"><button class="action" data-course="${c.id}">${state.done.includes(c.id)?'Relire le cours':'Découvrir le cours'}</button>${state.done.includes(c.id)?'<span class="tag">✓ Terminé</span>':''}</div></article>`).join('')}</div>`}function workCards(items=works){return `<div class="grid">${items.map(w=>`<article class="card work"><span class="tag">${esc(w.era)}</span><h3>${esc(w.name)}</h3><div class="muted">${esc(w.artist)} · ${esc(w.date)}</div><p>${esc(w.note)}</p><div class="actions"><button class="action secondary" data-work="${w.id}">Lire la fiche</button><button class="action" data-save="${w.id}" aria-pressed="${state.saved.includes(w.id)}">${state.saved.includes(w.id)?'♥ Retirer du musée':'♡ Ajouter au musée'}</button></div></article>`).join('')}</div>`}function render(){document.querySelectorAll('[data-tab]').forEach(b=>{b.classList.toggle('active',b.dataset.tab===tab);b.setAttribute('aria-current',b.dataset.tab===tab?'page':'false')});let out='';if(tab==='home'){out=hero('L’art se découvre à ton rythme.','Explore les époques, observe les œuvres et teste tes connaissances. Ici, aucun parcours n’est imposé.')+`<main class="shell main">${stats()}<h2>Choisis ta prochaine découverte</h2><p class="muted">Tous les cours sont accessibles dès maintenant.</p>${courseCards()}<section class="panel"><h2>Prêt·e à jouer ?</h2><p>12 questions pour réviser les grands mouvements et les œuvres.</p><button class="action" data-go="quiz">Commencer les exercices</button></section></main>`}else if(tab==='courses'){const c=courses.find(x=>x.id===courseOpen);out=hero('Les cours','Une bibliothèque ouverte : choisis le sujet qui t’inspire.')+`<main class="shell main">${c?`<button class="action secondary" data-back="courses">← Tous les cours</button><article class="panel"><span class="tag">${esc(c.era)}</span><h2>${esc(c.title)}</h2>${c.sections.map((s,i)=>`<h3>Partie ${i+1}</h3><p>${esc(s)}</p>`).join('')}<button class="action" data-done="${c.id}">${state.done.includes(c.id)?'✓ Cours terminé':'Marquer comme terminé · +50 XP'}</button></article>`:courseCards()}</main>`}else if(tab==='works'){const w=works.find(x=>x.id===workOpen);out=hero('Les œuvres','Un premier catalogue de huit œuvres à explorer et collectionner.')+`<main class="shell main">${w?`<button class="action secondary" data-back="works">← Toutes les œuvres</button><article class="panel"><span class="tag">${esc(w.era)}</span><h2>${esc(w.name)}</h2><p><strong>Artiste :</strong> ${esc(w.artist)}</p><p><strong>Date :</strong> ${esc(w.date)}</p><p>${esc(w.note)}</p><p class="muted">Cette fiche est une introduction. Les reproductions d’œuvres et les analyses approfondies seront ajoutées dans une prochaine version.</p><button class="action" data-save="${w.id}">${state.saved.includes(w.id)?'♥ Retirer du musée':'♡ Ajouter au musée'}</button></article>`:workCards()}</main>`}else if(tab==='museum'){out=hero('Mon musée','Garde tes œuvres préférées à portée de main.')+`<main class="shell main">${stats()}<h2>Ma collection</h2>${state.saved.length?workCards(works.filter(w=>state.saved.includes(w.id))):'<div class="empty">Ton musée est encore vide. Explore les fiches d’œuvres pour commencer ta collection ! <div class="actions"><button class="action" data-go="works">Explorer les œuvres</button></div></div>'}<p class="muted">Ta collection est enregistrée uniquement dans ce navigateur. Elle ne se synchronise pas entre appareils.</p></main>`}else{let q=questions[quizIndex];let answer=state.answered[quizIndex];let chosen=quizChoice===null?(answer===undefined?null:answer):quizChoice;out=hero('Le défi des œuvres','Réponds aux questions, découvre les explications et gagne 10 XP par bonne réponse.')+`<main class="shell main"><section class="panel"><div class="muted">Question ${quizIndex+1} sur ${questions.length}</div><div class="progress" aria-label="Progression des exercices"><div style="width:${(quizIndex+1)/questions.length*100}%"></div></div><h2 class="question">${esc(q.q)}</h2><div class="answers">${q.a.map((a,i)=>`<button class="answer ${chosen!==null?(i===q.correct?'correct':i===chosen?'wrong':''):''}" data-answer="${i}" ${chosen!==null?'disabled':''}>${esc(a)}</button>`).join('')}</div>${chosen!==null?`<p class="feedback">${chosen===q.correct?'✓ Bonne réponse !':'Ce n’est pas la bonne réponse.'}</p><p>${esc(q.why)}</p>`:''}<div class="actions"><button class="action secondary" data-prev ${quizIndex===0?'disabled':''}>← Précédente</button><button class="action" data-next ${quizIndex===questions.length-1?'disabled':''}>Suivante →</button><button class="action secondary" data-restart>Recommencer</button></div><p class="muted">Score : ${Object.keys(state.answered).filter(i=>state.answered[i]===questions[i].correct).length} bonnes réponses enregistrées sur ${questions.length}.</p></section></main>`}app.innerHTML=out}document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;courseOpen=null;workOpen=null}else if(b.dataset.go){tab=b.dataset.go}else if(b.dataset.course){tab='courses';courseOpen=b.dataset.course}else if(b.dataset.work){tab='works';workOpen=b.dataset.work}else if(b.dataset.back){tab=b.dataset.back;courseOpen=null;workOpen=null}else if(b.dataset.done){if(!state.done.includes(b.dataset.done))state.done.push(b.dataset.done);persist()}else if(b.dataset.save){state.saved=state.saved.includes(b.dataset.save)?state.saved.filter(x=>x!==b.dataset.save):[...state.saved,b.dataset.save];persist()}else if(b.dataset.answer!==undefined){if(state.answered[quizIndex]===undefined){quizChoice=Number(b.dataset.answer);state.answered[quizIndex]=quizChoice;persist()}}else if(b.hasAttribute('data-next')){quizIndex=Math.min(questions.length-1,quizIndex+1);quizChoice=null}else if(b.hasAttribute('data-prev')){quizIndex=Math.max(0,quizIndex-1);quizChoice=null}else if(b.hasAttribute('data-restart')){state.answered={};persist();quizIndex=0;quizChoice=null}render();if(!b.dataset.answer)window.scrollTo({top:0,behavior:'instant'})});render();
</script></body></html>
