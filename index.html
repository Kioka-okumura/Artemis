:root{--green:#153e35;--green2:#275e50;--cream:#faf8f2;--gold:#c7a266;--ink:#203b32;--muted:#62786e;--line:#dfe7df}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.65 system-ui,Segoe UI,sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:3px}.wrap{max-width:1100px;margin:auto;padding:0 20px}.top{position:sticky;top:0;z-index:5;background:var(--green);color:#fff}.nav{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding-top:12px;padding-bottom:12px}.brand{font:30px Georgia,serif}.brand span{color:#e4c78f}.links{display:flex;gap:4px;overflow:auto}.links button{border:0;background:transparent;color:white;border-radius:10px;padding:10px 12px;white-space:nowrap}.links button.active,.links button:hover{background:#ffffff26}.hero{background:linear-gradient(125deg,#153e35,#326a56);color:white;padding:50px 0}.hero h1{font:normal clamp(35px,5vw,60px)/1.12 Georgia,serif;margin:8px 0}.hero p{max-width:650px;color:#e2eee7}.eyebrow{color:#ead29e;letter-spacing:.13em;font-size:12px;font-weight:800;text-transform:uppercase}.main{padding-top:30px;padding-bottom:75px;min-height:55vh}h2{font:normal 32px Georgia,serif}h3{margin:8px 0;font-size:21px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin:20px 0}.card,.panel,.stat{background:white;border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 26px #153e350a}.card{padding:22px;overflow:hidden}.panel{padding:28px;margin:20px 0}.tag{display:inline-block;background:#e7f0e8;border-radius:30px;color:var(--green);font-size:12px;font-weight:800;padding:5px 12px}.btn{background:var(--green);color:#fff;border:1px solid var(--green);border-radius:10px;padding:11px 16px;font-weight:700;text-decoration:none;display:inline-block}.btn:hover{background:var(--green2)}.btn.alt{background:#fff;color:var(--green)}.btn:disabled{opacity:.5;cursor:not-allowed}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px}.art{height:190px;background:#e5e9e2;display:grid;place-items:center;margin:-22px -22px 18px;overflow:hidden}.art img{width:100%;height:100%;object-fit:contain}.art.large{height:clamp(190px,35vw,290px);margin:0 0 22px;border-radius:12px}.art img{display:block;max-width:100%;max-height:100%;object-fit:contain}.art .placeholder{font-size:14px}.art a{color:var(--green)}.placeholder{padding:15px;text-align:center;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{padding:18px}.stat strong{display:block;font:30px Georgia,serif}.stat small{color:var(--muted)}.steps{display:flex;gap:7px;flex-wrap:wrap;margin:20px 0}.steps button{border:1px solid #b9cec2;border-radius:10px;background:white;padding:8px 13px}.steps button.current{background:var(--green);color:#fff}.lesson-text{font-size:18px;line-height:1.85;max-width:75ch}.note{border-left:4px solid var(--gold);background:#f7f2e8;border-radius:7px;padding:15px 19px;margin:20px 0}.answers{display:grid;gap:10px;margin:18px 0}.answer{border:1px solid #c6d7cc;border-radius:12px;background:white;padding:14px;text-align:left}.answer.correct{background:#ddf4e4;border-color:#3b8d5b}.answer.wrong{background:#fbe7e2;border-color:#b8655b}.answer:disabled{cursor:default}.progress{height:9px;background:#e1ebe3;border-radius:20px;overflow:hidden}.progress div{height:100%;background:var(--gold)}.toolbar{display:flex;gap:10px;flex-wrap:wrap}.toolbar input,.toolbar select{padding:11px;border:1px solid #b8cbbd;border-radius:10px;background:white;max-width:100%}.toolbar input{min-width:min(100%,300px)}.footer{border-top:1px solid var(--line);padding:24px 0;font-size:13px;color:var(--muted)}.footer a{color:var(--green)}@media(max-width:700px){.grid{grid-template-columns:1fr}.panel{padding:19px}.nav{align-items:flex-start}.links{width:100%}.stats{gap:7px}.stat{padding:10px}.stat strong{font-size:24px}.hero{padding:35px 0}}

const DATA={"courses":[{"id":"antique","title":"L’art de l’Antiquité","era":"Antiquité","emoji":"🏛️","description":"Égypte, Grèce et Rome : trois manières de représenter le monde.","sections":[{"title":"L’Égypte : des images pour l’éternité","body":"Dans l’Égypte ancienne, la peinture et la sculpture servent souvent les croyances, les rites funéraires et le pouvoir royal. Sur les parois des tombes, une figure peut montrer la tête de profil, l’œil de face et le torse frontal. Ce choix privilégie la lisibilité de chaque partie du corps plutôt qu’une perspective réaliste.","task":"Observe une peinture égyptienne : quelles parties du corps sont de profil ?","work":"nefertiti"},{"title":"La Grèce : proportions et mouvement","body":"Les artistes grecs étudient les proportions du corps humain. Le contrapposto répartit le poids du corps de façon asymétrique et donne une impression de naturel. Le Discobole, connu par des copies romaines, capture un instant de tension avant le lancer du disque.","task":"Repère comment le torse et les membres suggèrent un mouvement.","work":"discobole"},{"title":"Rome : portraits et mémoire","body":"Les Romains développent le portrait sculpté, la mosaïque, la fresque et l’architecture monumentale. Les images peuvent commémorer une personne, raconter une victoire ou afficher l’autorité impériale. Les échanges avec l’art grec sont constants, mais les usages politiques et domestiques sont particulièrement visibles.","task":"Pourquoi un dirigeant ferait-il réaliser son portrait ?","work":"discobole"}]},{"id":"renaissance","title":"La Renaissance","era":"XVe–XVIe siècles","emoji":"🎨","description":"Perspective, humanisme et observation du monde.","sections":[{"title":"Redécouvrir l’Antiquité","body":"À partir du XVe siècle, notamment en Italie, artistes et savants étudient les textes et les vestiges antiques. Ils cherchent à représenter le corps et l’espace avec de nouveaux outils, sans abandonner les thèmes religieux. La Renaissance n’est pas une rupture instantanée : les traditions médiévales continuent d’influencer les œuvres.","task":"Quels éléments antiques reconnais-tu dans les œuvres de Botticelli ?","work":"venus"},{"title":"Construire la profondeur","body":"La perspective linéaire utilise un horizon et des lignes convergeant vers un point de fuite. Elle aide à représenter un espace tridimensionnel sur une surface plane. Les artistes utilisent aussi la diminution des tailles et les variations de contraste pour suggérer la distance.","task":"Imagine des rails : vers quel point semblent-ils se rejoindre ?","work":"joconde"},{"title":"Léonard de Vinci et le sfumato","body":"Dans La Joconde, Léonard de Vinci adoucit les transitions entre les zones claires et sombres. Ce procédé, appelé sfumato, évite les contours trop nets et rend le visage vivant. Le paysage en arrière-plan contribue à la profondeur mystérieuse de la composition.","task":"Observe les contours de la bouche : sont-ils nets ou fondus ?","work":"joconde"}]},{"id":"impressionnisme","title":"L’impressionnisme","era":"XIXe siècle","emoji":"🌤️","description":"Peindre la lumière et les sensations d’un instant.","sections":[{"title":"Une nouvelle façon d’exposer","body":"En 1874, des artistes organisent à Paris une exposition indépendante du Salon officiel. Ils privilégient parfois les scènes de la vie moderne, les paysages et les effets de lumière. Le groupe n’a pas un style parfaitement uniforme : chaque peintre développe son approche.","task":"Pourquoi exposer hors des institutions officielles ?","work":"soleil"},{"title":"Couleurs et touches visibles","body":"Les peintres impressionnistes utilisent souvent des touches juxtaposées et des couleurs qui traduisent les variations de lumière. Les ombres ne sont pas nécessairement noires. La peinture en plein air devient plus facile grâce aux tubes de couleur, même si beaucoup d’œuvres sont aussi retravaillées en atelier.","task":"Dans une zone d’ombre, repère les couleurs autres que le noir.","work":"bal"},{"title":"Monet et Renoir","body":"Impression, soleil levant (1872) de Monet a inspiré le nom du mouvement. Renoir, dans Bal du moulin de la Galette (1876), montre les loisirs parisiens et la lumière filtrant à travers les arbres. Les deux œuvres donnent une place centrale aux sensations visuelles.","task":"Compare la lumière du port de Monet et celle de la fête de Renoir.","work":"soleil"}]},{"id":"nouveau","title":"L’Art nouveau","era":"Vers 1890–1914","emoji":"🌿","description":"Quand la nature inspire les arts du quotidien.","sections":[{"title":"Un art dans la vie quotidienne","body":"L’Art nouveau apparaît dans plusieurs pays à la fin du XIXe siècle. Il touche les bâtiments, les meubles, les affiches, les objets et les bijoux. Son ambition est souvent de rapprocher les beaux-arts des arts décoratifs et de créer des ensembles harmonieux.","task":"Quels objets de ton quotidien pourraient devenir des œuvres décoratives ?","work":"job"},{"title":"La nature comme vocabulaire","body":"Les courbes végétales, les tiges, les fleurs et les lignes ondulantes reviennent fréquemment. Mais l’Art nouveau ne se limite pas aux fleurs : il explore aussi les matériaux modernes, la structure et l’ornement. Les formes varient selon les régions et les créateurs.","task":"Repère trois lignes courbes dans une affiche de Mucha.","work":"job"},{"title":"Mucha et l’affiche","body":"Alphonse Mucha devient célèbre grâce à ses affiches parisiennes. Ses compositions associent figures féminines, ornements, typographie et motifs naturels. L’affiche est à la fois une création graphique et un support de communication, particulièrement intéressant pour la signalétique et le décor graphique.","task":"Comment le regard circule-t-il entre l’image et le texte de l’affiche ?","work":"job"}]}],"works":[{"id":"nefertiti","name":"Buste de Néfertiti","artist":"Atelier de Thoutmôsis (attribution)","date":"vers 1340 av. J.-C.","era":"Égypte antique","file":"Nofretete_Neues_Museum.jpg","note":"Ce buste polychrome montre une recherche de finesse dans le modelé du visage. Il appartient à la période amarnienne."},{"id":"discobole","name":"Le Discobole","artist":"Myron (original perdu)","date":"Ve siècle av. J.-C.","era":"Grèce antique","file":"Discobolus_Lancelotti_Massimo.jpg","note":"L’original grec est perdu. Des copies romaines permettent d’étudier cette composition fondée sur le mouvement."},{"id":"joconde","name":"La Joconde","artist":"Léonard de Vinci","date":"vers 1503–1519","era":"Renaissance","file":"Mona_Lisa,_by_Leonardo_da_Vinci,_from_C2RMF_retouched.jpg","note":"Le sfumato adoucit les contours du visage. Le paysage et la posture construisent un portrait complexe."},{"id":"venus","name":"La Naissance de Vénus","artist":"Sandro Botticelli","date":"vers 1485","era":"Renaissance","file":"Birth_of_Venus_Botticelli.jpg","note":"Une scène mythologique aux lignes fluides qui témoigne du goût renaissant pour les sujets antiques."},{"id":"soleil","name":"Impression, soleil levant","artist":"Claude Monet","date":"1872","era":"Impressionnisme","file":"Claude_Monet,_Impression,_soleil_levant.jpg","note":"Un port brumeux, un soleil orangé et des touches rapides donnent une impression d’instant."},{"id":"bal","name":"Bal du moulin de la Galette","artist":"Auguste Renoir","date":"1876","era":"Impressionnisme","file":"Pierre-Auguste_Renoir_-_Bal_du_moulin_de_la_Galette.jpeg","note":"La scène montre les loisirs parisiens et les taches de lumière sur les vêtements et les visages."},{"id":"job","name":"JOB","artist":"Alphonse Mucha","date":"1896","era":"Art nouveau","file":"Mucha-job.jpg","note":"Une affiche publicitaire où chevelure, arabesques et typographie deviennent une composition décorative."},{"id":"kiss","name":"Le Baiser","artist":"Gustav Klimt","date":"1907–1908","era":"Sécession viennoise","file":"Gustav_Klimt_016.jpg","note":"La surface dorée et les motifs géométriques créent une image emblématique de la Sécession viennoise."}],"questions":[{"topic":"antique","q":"Quel élément est fréquent dans les représentations égyptiennes ?","a":["La combinaison de plusieurs points de vue","La photographie","La perspective à un point de fuite"],"correct":0,"why":"Les figures égyptiennes combinent souvent profil et frontalité."},{"topic":"antique","q":"Le Discobole représente…","a":["Un musicien","Un lanceur de disque","Un empereur"],"correct":1,"why":"Le Discobole montre un athlète au moment du lancer."},{"topic":"antique","q":"L’original grec du Discobole est conservé intact.","a":["Vrai","Faux"],"correct":1,"why":"Il est perdu et connu grâce à des copies romaines."},{"topic":"renaissance","q":"La perspective linéaire permet surtout de…","a":["Créer une profondeur","Dorer une surface","Sculpter le marbre"],"correct":0,"why":"Les lignes convergentes suggèrent l’espace en trois dimensions."},{"topic":"renaissance","q":"Quel artiste a peint La Joconde ?","a":["Botticelli","Léonard de Vinci","Renoir"],"correct":1,"why":"Léonard de Vinci est l’auteur de La Joconde."},{"topic":"renaissance","q":"Le sfumato se caractérise par…","a":["Des contours très durs","Des transitions douces","Des formes géométriques"],"correct":1,"why":"Le sfumato fond subtilement les contours et les ombres."},{"topic":"impressionnisme","q":"Qui a peint Impression, soleil levant ?","a":["Monet","Mucha","Klimt"],"correct":0,"why":"Claude Monet a peint cette toile en 1872."},{"topic":"impressionnisme","q":"Les impressionnistes s’intéressent aux variations de lumière.","a":["Vrai","Faux"],"correct":0,"why":"La lumière et ses changements sont essentiels à nombre de leurs œuvres."},{"topic":"impressionnisme","q":"Bal du moulin de la Galette montre…","a":["Une bataille antique","Une fête parisienne","Une scène mythologique"],"correct":1,"why":"Renoir représente une scène de loisirs à Paris."},{"topic":"nouveau","q":"Quel motif évoque souvent l’Art nouveau ?","a":["Les courbes végétales","Les pixels","Les plans techniques uniquement"],"correct":0,"why":"L’Art nouveau emprunte souvent ses lignes au monde vivant."},{"topic":"nouveau","q":"L’Art nouveau concerne aussi les affiches et les meubles.","a":["Vrai","Faux"],"correct":0,"why":"Il traverse de nombreux arts décoratifs et appliqués."},{"topic":"nouveau","q":"Qui est célèbre pour ses affiches Art nouveau ?","a":["Myron","Mucha","Monet"],"correct":1,"why":"Alphonse Mucha est connu pour ses affiches décoratives."}]};const {courses,works,questions}=DATA;const KEY='artemis-demo-v1';let state;try{state=JSON.parse(localStorage.getItem(KEY))||{}}catch{state={}}state.done=Array.isArray(state.done)?state.done:[];state.saved=Array.isArray(state.saved)?state.saved:[];state.answered=state.answered&&typeof state.answered==='object'?state.answered:{};let tab='home',courseId=null,step=0,workId=null,topic='all',quizPos=0,search='',era='all';const app=document.getElementById('app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}}function correct(){return Object.keys(state.answered).filter(i=>questions[i]&&state.answered[i]===questions[i].correct).length}function xp(){return state.done.length*50+correct()*10}function hero(title,sub){return `<section class="hero"><div class="wrap"><div class="eyebrow">✦ Artémis · Apprendre à regarder l’art</div><h1>${title}</h1><p>${sub}</p></div></section>`}function stats(){return `<div class="stats"><div class="stat"><strong>${xp()}</strong><small>XP gagnés</small></div><div class="stat"><strong>${state.done.length}/4</strong><small>Cours terminés</small></div><div class="stat"><strong>${state.saved.length}</strong><small>Œuvres favorites</small></div></div>`}function img(w,large=false){const find='https://commons.wikimedia.org/w/index.php?search='+encodeURIComponent(w.name+' '+w.artist)+'&title=Special:MediaSearch&type=image';return `<div class="art ${large?'large':''}" data-art-id="${esc(w.id)}"><span class="placeholder">Chargement de la reproduction (9 secondes maximum)…</span><div class="placeholder" hidden>🖼️ Cette reproduction ne peut pas être affichée automatiquement.<br><a href="${find}" target="_blank" rel="noopener">Voir les images sur Wikimedia Commons</a></div></div>`}
// Images deterministes : pas de requete API bloquante.
// Les noms des fichiers proviennent de la bibliotheque d'oeuvres existante.
function loadArtImages(){
  document.querySelectorAll('.art[data-art-id]').forEach(node=>{
    if(node.dataset.loadingStarted==='yes')return;
    node.dataset.loadingStarted='yes';
    const w=works.find(x=>x.id===node.dataset.artId);
    const loading=node.querySelector('.placeholder');
    const fallback=node.querySelectorAll('.placeholder')[1];
    if(!w){loading.hidden=true;fallback.hidden=false;return;}
    const image=new Image();
    image.alt='Reproduction : '+w.name;
    image.decoding='async';
    image.referrerPolicy='no-referrer';
    let finished=false;
    const timer=setTimeout(()=>fail(),9000);
    function fail(){if(finished)return;finished=true;clearTimeout(timer);if(node.isConnected){loading.hidden=true;fallback.hidden=false;}}
    image.onload=()=>{if(finished)return;finished=true;clearTimeout(timer);if(node.isConnected){loading.hidden=true;fallback.hidden=true;node.prepend(image);}};
    image.onerror=fail;
    // URL de fichier stable plutot que recherche automatique.
    image.src='https://commons.wikimedia.org/wiki/Special:FilePath/'+encodeURIComponent(w.file)+'?width=500';
  });
}

const ENRICH=[{"title": "Comprendre les conventions", "detail": "La représentation égyptienne ne cherche pas toujours à reproduire ce que voit un œil placé à un endroit précis. Les artistes associent plusieurs points de vue pour rendre chaque élément reconnaissable. Les proportions peuvent aussi exprimer la hiérarchie : un souverain est parfois plus grand que les autres personnages.", "term": "Registre", "definition": "Bande horizontale organisant les scènes dans une composition.", "question": "Pourquoi les figures combinent-elles plusieurs points de vue ?", "answers": ["Pour rendre les éléments lisibles", "Pour montrer une photographie", "Pour supprimer les symboles"], "correct": 0, "why": "Le principe est de rendre chaque élément immédiatement identifiable."}, {"title": "Le mouvement sculpté", "detail": "Dans la sculpture grecque classique, la recherche d’équilibre accompagne l’étude de l’anatomie. Le Discobole, attribué à Myron, présente une torsion complexe : la pose semble suspendue entre préparation et action. Attention : le contrapposto désigne plus précisément le déhanchement d’une figure debout, comme le Doryphore de Polyclète.", "term": "Contrapposto", "definition": "Répartition asymétrique du poids du corps sur une jambe d’appui.", "question": "Quelle œuvre illustre surtout un mouvement de lancer ?", "answers": ["Le Discobole", "La Joconde", "JOB"], "correct": 0, "why": "Le Discobole met en scène la tension d’un athlète avant son geste."}, {"title": "Art et pouvoir", "detail": "Le portrait romain pouvait célébrer les ancêtres, manifester un rang social ou diffuser l’image d’un empereur. Les statues publiques, les monnaies et les reliefs contribuaient à rendre une autorité visible dans des territoires éloignés. Les visages pouvaient être idéalisés ou montrer des traits marqués selon les époques et les intentions.", "term": "Relief", "definition": "Sculpture dont les formes se détachent d’un fond.", "question": "Quel support pouvait diffuser le visage d’un roduit le sfumato ?", "answers": ["Des transitions fondues", "Des contours très épais", "Une mosaïque de pierres"], "correct": 0, "why": "Les limites entre les zones colorées deviennent subtiles."}, {"title": "Peindre autrement", "detail": "L’exposition de 1874 est organisée par une société d’artistes indépendants à Paris. Le terme « impressionnisme » est associé au titre Impression, soleil levant de Claude Monet, d’abord employé de manière critique. Les artistes ne suivent pas tous les mêmes règles, mais explorent souvent la lumière et la vie moderne.", "term": "Salon", "definition": "Exposition artistique officielle jouant un rôle majeur dans la carrière des peintres au XIXe siècle.", "question": "En quelle année a lieu la première exposition impressionniste ?", "answers": ["1874", "1789", "1914"], "correct": 0, "why": "La première exposition du groupe a lieu en 1874."}, {"title": "Observer les touches", "detail": "Approche-toi mentalement d’une toile impressionniste : les touches de peinture peuvent sembler séparées. En prenant du recul, elles se combinent dans le regard. Les contrastes colorés participent à la vibration lumineuse. Il n’existe pourtant pas une seule façon impressionniste de poser la couleur.", "term": "Touche", "definition": "Trace laissée par le pinceau ou un autre outil sur la surface peinte.", "question": "Que peut-on observer dans la peinture impressionniste ?", "answers": ["Des touches visibles", "Uniquement des aplats noirs", "Seulement des contours gravés"], "correct": 0, "why": "La touche devient souvent un élément perceptible de la peinture."}, {"title": "Des scènes de la vie moderne", "detail": "Renoir peint volontiers les rencontres, les loisirs et les figures humaines. Dans Le Bal du moulin de la Galette, les personnages se mêlent dans une scène animée, ponctuée de taches lumineuses. Monet s’intéresse notamment aux séries : il observe un même motif sous des lumières différentes.", "term": "Série", "definition": "Ensemble d’œuvres qui  return hero('Le Lexique des Arts','60 fiches illustrées : un terme, une image explicative, une définition et un exemple. Consulte-les librement !')+`<main class="wrap main"><section class="panel"><h2>Rechercher un terme</h2><label for="lex-search">Mot ou définition</label><input id="lex-search" placeholder="Ex. : vitrail, fresque, portrait…" value="${esc(lexSearch)}" style="width:100%;padding:12px;border:1px solid var(--line);border-radius:10px"><div class="lex-filters">${cats.map(c=>`<button class="btn ${c===lexCategory?'':'alt'}" data-lex-cat="${esc(c)}">${esc(c)}</button>`).join('')}</div><p class="muted" id="lex-count">${filtered.length} fiches disponibles</p></section><div id="lex-results">${lexCards(filtered)}</div></main>`;
}
function lexCards(items){return `<div class="lex-grid">${items.map(t=>`<article class="card lex-card">${lexImg(t)}<div class="lex-body"><span class="tag">${esc(t.category)}</span><h3>${esc(t.name)}</h3><p>${esc(t.definition)}</p><p class="muted"><strong>Exemple :</strong> ${esc(t.example)}</p><button class="btn alt" data-lex-open="${esc(t.name)}">Agrandir l'image ↗</button></div></article>`).join('')}</div>${items.length?'':'<section class="panel">Aucun terme ne correspond à cette recherche.</section>'}`}
function lexModal(t){return `<div class="lex-overlay" role="dialog" aria-modal="true" aria-label="Illustration : ${esc(t.name)}"><div class="lex-dialog"><button class="btn" data-lex-close>✕ Fermer</button>${lexImg(t)}<h2>${esc(t.name)}</h2><p>${esc(t.definition)}</p><p class="muted">${esc(t.example)}</p><small>Illustration pédagogique originale réalisée pour Artémis. Schéma simplifié, non reproduction d'une œuvre.</small></div></div>`}

function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let out='';if(tab==='lexicon'){out=renderLexicon()}else if(tab==='home'){out=hero('L’art se découvre à ton rythme.','Choisis une époque, explore des œuvres célèbres et vérifie tes connaissances. Aucun cours n’est verrouillé.')+`<main class="wrap main">${stats()}<h2>Choisis ton aventure artistique</h2>${courseCards()}<section class="panel"><h2>Prête pour un défi ?</h2><p>12 questions corrigées, réparties par époque.</p><button class="btn" data-go="quiz">Faire un quiz →</button></section></main>`}else if(tab==='courses'){let c=courses.find(c=>c.id===courseId);out=hero('Les cours','De véritables chapitres à parcourir, des œuvres à observer et un quiz pour réviser.')+`<main class="wrap main">${c?`<button class="btn alt" data-back="courses">← Tous les cours</button><article class="panel"><span class="tag">${esc(c.era)} · Chapitre ${step+1}/3</span><h2>${esc(c.title)}</h2><div class="steps">${c.sections.map((s,i)=>`<button class="${i===step?'current':''}" data-step="${i}">${i+1}. ${esc(s.title)}</button>`).join('')}</div><h3>${esc(c.sections[step].title)}</h3><p class="lesson-text">${esc(c.sections[step].body)}</p>${img(works.find(w=>w.id===c.sections[step].work),true)}<p class="muted">Œuvre à observer : ${esc(works.find(w=>w.id===c.sections[step].work).name)}</p><div class="note"><strong>À toi d’observer :</strong> ${esc(c.sections[step].task)}</div>${chapterExtra()}<div class="actions"><button class="btn alt" data-prevstep ${step===0?'disabled':''}>← Précédent</button>${step<2?'<button class="btn" data-nextstep>Chapitre suivant →</button>':`<button class="btn" data-done="${c.id}">${state.done.includes(c.id)?'✓ Cours terminé':'Terminer le cours · +50 XP'}</button><button class="btn alt" data-quiztopic="${c.id}">Tester mes connaissances →</button>`}</div></article>`:courseCards()}</main>`}else if(tab==='works'){let w=works.find(w=>w.id===workId);let arr=works.filter(w=>(era==='all'||w.era===era)&&`${w.name} ${w.artist} ${w.era}`.toLowerCase().includes(search.toLowerCase()));out=hero('Les œuvres','Huit premières œuvres à explorer et à conserver dans ton musée personnel.')+`<main class="wrap main">${w?`<button class="btn alt" data-back="works">← Toutes les œuvres</button><article class="panel">${img(w,true)}<span class="tag">${esc(w.era)}</span><h2>${esc(w.name)}</h2><p><strong>Artiste :</strong> ${esc(w.artist)}</p><p><strong>Date :</strong> ${esc(w.date)}</p><p>${esc(w.note)}</p><div class="note">Observe la composition, la lumière, les lignes et le rôle de cette œuvre dans son époque.</div><div class="actions"><button class="btn" data-fav="${w.id}">${state.saved.includes(w.id)?'♥ Retirer du musée':'♡ Ajouter à mon musée'}</button><a class="btn alt" href="https://commons.wikimedia.org/wiki/Special:FilePath/${encodeURIComponent(w.file)}" target="_blank" rel="noopener">Voir l’image source ↗</a></div></article>`:`<div class="toolbar"><input id="search" placeholder="Chercher une œuvre ou un artiste" aria-label="Rechercher" value="${esc(search)}"><select id="era" aria-label="Filtrer les œuvres"><option value="all">Toutes les périodes</option>${[...new Set(works.map(w=>w.era))].map(e=>`<option ${era===e?'selected':''}>${esc(e)}</option>`).join('')}</select></div><div id="results">${workCards(arr)}</div>`}</main>`}else if(tab==='atelier'){out=atelier()}else if(tab==='museum'){out=hero('Mon musée','Retrouve les œuvres que tu as choisies.')+`<main class="wrap main">${stats()}<h2>Mes œuvres favorites</h2>${state.saved.length?workCards(works.filter(w=>state.saved.includes(w.id))):'<section class="panel"><p>Ton musée est encore vide.</p><button class="btn" data-go="works">Découvrir les œuvres →</button></section>'}<p class="muted">Tes favoris et tes points restent sur cet appareil et ce navigateur. Ils ne sont pas synchronisés entre appareils.</p></main>`}else{let ids=indices();quizPos=Math.max(0,Math.min(quizPos,ids.length-1));let ix=ids[quizPos],q=questions[ix],ans=state.answered[ix];out=hero('Les exercices','Révise les quatre périodes, à ton rythme, avec des corrections expliquées.')+`<main class="wrap main"><section class="panel"><label for="topic"><strong>Choisir un thème : </strong></label> <select id="topic"> <option value="all">Tous les thèmes</option>${courses.map(c=>`<option value="${c.id}" ${topic===c.id?'selected':''}>${esc(c.title)}</option>`).join('')}</select><p class="muted">Question ${quizPos+1} sur ${ids.length}</p><div class="progress"><div style="width:${(quizPos+1)/ids.length*100}%"></div></div><h2>${esc(q.q)}</h2><div class="answers">${q.a.map((a,i)=>`<button class="answer ${ans!==undefined?(i===q.correct?'correct':i===ans?'wrong':''):''}" data-answer="${i}" ${ans!==undefined?'disabled':''}>${esc(a)}</button>`).join('')}</div>${ans!==undefined?`<div class="note"><strong>${ans===q.correct?'✓ Bonne réponse !':'À revoir !'}</strong> ${esc(q.why)}</div>`:''}<div class="actions"><button class="btn alt" data-prevquiz ${quizPos===0?'disabled':''}>← Précédente</button><button class="btn" data-nextquiz ${quizPos===ids.length-1?'disabled':''}>Suivante →</button><button class="btn alt" data-reset>Recommencer les quiz</button></div><p class="muted">${correct()} bonnes réponses enregistrées · ${xp()} XP</p></section></main>`}app.innerHTML=out+(lexSelected&&tab==='lexicon'?lexModal(LEXICON.find(t=>t.name===lexSelected)):'');loadArtImages()}function go(t){tab=t;courseId=null;workId=null;render();window.scrollTo(0,0)}document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let scroll=true;if(b.dataset.tab)go(b.dataset.tab);else if(b.dataset.lexCat!==undefined){lexCategory=b.dataset.lexCat;lexSelected=null;scroll=false}else if(b.dataset.lexOpen){lexSelected=b.dataset.lexOpen;scroll=false}else if(b.hasAttribute('data-lex-close')){lexSelected=null;scroll=false}else if(b.dataset.go)go(b.dataset.go);else if(b.dataset.period!==undefined){atelierPeriod=Number(b.dataset.period)}else if(b.dataset.course){tab='courses';courseId=b.dataset.course;step=0}else if(b.dataset.work){tab='works';workId=b.dataset.work}else if(b.dataset.back)go(b.dataset.back);else if(b.dataset.step!==undefined)step=Number(b.dataset.step);else if(b.hasAttribute('data-nextstep'))step=Math.min(2,step+1);else if(b.hasAttribute('data-prevstep'))step=Math.max(0,step-1);else if(b.dataset.done){if(!state.done.includes(b.dataset.done))state.done.push(b.dataset.done);save()}else if(b.dataset.quiztopic){topic=b.dataset.quiztopic;quizPos=0;tab='quiz'}else if(b.dataset.fav){state.saved=state.saved.includes(b.dataset.fav)?state.saved.filter(x=>x!==b.dataset.fav):[...state.saved,b.dataset.fav];save();scroll=false}else if(b.dataset.chapterAnswer!==undefined){let n=chapterId();if(n>=0&&chapterState[n]===undefined){chapterState[n]=Number(b.dataset.chapterAnswer);try{localStorage.setItem(CHAPTER_KEY,JSON.stringify(chapterState))}catch{}}scroll=false}else if(b.dataset.answer!==undefined){let ix=indices()[quizPos];if(state.answered[ix]===undefined){state.answered[ix]=Number(b.dataset.answer);save()}scroll=false}else if(b.hasAttribute('data-nextquiz'))quizPos=Math.min(indices().length-1,quizPos+1);else if(b.hasAttribute('data-prevquiz'))quizPos=Math.max(0,quizPos-1);else if(b.hasAttribute('data-reset')){if(confirm('Effacer seulement les réponses aux quiz ?')){state.answered={};save();quizPos=0}}else return;render();if(scroll)window.scrollTo(0,0)});document.addEventListener('change',e=>{if(e.target.id==='compare-left'){compareLeft=e.target.value;render()}if(e.target.id==='compare-right'){compareRight=e.target.value;render()}if(e.target.id==='topic'){topic=e.target.value;quizPos=0;render()}if(e.target.id==='era'){era=e.target.value;render()}});document.addEventListener('input',e=>{if(e.target.id==='lex-search'){lexSearch=e.target.value;const items=LEXICON.filter(t=>(lexCategory==='Tous'||t.category===lexCategory)&&`${t.name} ${t.definition} ${t.example}`.toLocaleLowerCase('fr').includes(lexSearch.toLocaleLowerCase('fr')));document.getElementById('lex-results').innerHTML=lexCards(items);document.getElementById('lex-count').textContent=items.length+' fiches disponibles'}if(e.target.id==='search'){search=e.target.value;let arr=works.filter(w=>(era==='all'||w.era===era)&&`${w.name} ${w.artist} ${w.era}`.toLowerCase().includes(search.toLowerCase()));document.getElementById('results').innerHTML=workCards(arr);loadArtImages()}});render();
</script></body></html>
